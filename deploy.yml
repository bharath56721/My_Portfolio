name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-website/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-website
        run: npm ci

      - name: Build project
        working-directory: portfolio-website
        run: npm run build

      - name: Check dist files
        working-directory: portfolio-website
        run: |
          echo "=== DIST ==="
          ls -la dist
          echo "=== ASSETS ==="
          ls -la dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./portfolio-website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4